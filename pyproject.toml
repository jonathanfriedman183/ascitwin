[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascitwin"
version = "0.1.0"
description = "Aggregate-to-spatiotemporal constraint inversion for a physics-informed digital twin of the colorectal tumour microenvironment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["physics-informed-neural-network", "digital-twin", "colorectal-cancer", "constraint-inversion", "immunotherapy"]
dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "omegaconf>=2.3",
    "plac>=1.4",
]

[project.optional-dependencies]
export = ["onnx>=1.15"]
dev = ["ruff", "black", "isort", "mypy", "pytest"]

[project.scripts]
ascitwin = "ascitwin.console:main"

[tool.setuptools.packages.find]
include = ["ascitwin*"]

[tool.setuptools.package-data]
ascitwin = ["py.typed"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ascitwin"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ascitwin"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["ascitwin"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["plac", "scipy.*", "omegaconf", "onnx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
